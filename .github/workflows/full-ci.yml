name: Full CI

# Deliberately unrealistic: one sequential frontend pipeline that packs
# the GitHub-hosted equivalents of several caching/compute beats into a
# single job so two Actions runs (se-demo-app vs se-demo-app-unmigrated)
# line up step-for-step for a side-by-side timing walk. Step *names*
# match the migrated twin; `uses:` differ only where Blacksmith needs a
# different action.
#
# Not a realistic CI shape — preface that on the call. Container caching
# is demoted to the existing Docker / Integration workflows, where the
# image pull is something the job actually needs.

on:
  workflow_dispatch:
  schedule:
    # Keep actions/cache and type=gha Docker cache warm between demos.
    # Offset from ci/test/docker crons.
    - cron: "15 14 * * 1-5"

env:
  # Higher than ci/test (200) so Unit tests alone land in the multi-minute
  # range on ubuntu-latest — the wall-clock knob for this demo beat.
  METRICS_WORKLOAD: "400"

permissions:
  contents: read

jobs:
  full-pipeline:
    name: Full pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          # No cache: here — Restore dependency cache is the colocated-cache beat.

      - name: Restore dependency cache
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: full-ci-npm-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            full-ci-npm-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Restore browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: full-ci-playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            full-ci-playwright-${{ runner.os }}-

      - name: Install browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build

      - name: E2E tests
        run: npm run test:e2e

      - name: Set up Docker builder
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: frontend/
          push: false
          tags: |
            ghcr.io/${{ github.repository }}/metrics-dashboard:${{ github.sha }}
            ghcr.io/${{ github.repository }}/metrics-dashboard:full-ci
          cache-from: type=gha,scope=full-ci-frontend
          cache-to: type=gha,mode=max,scope=full-ci-frontend
